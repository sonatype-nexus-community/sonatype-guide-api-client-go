  /api/v3/version:
    get:
      deprecated: true
      description: Returns the API version information. This endpoint is public and
        does not require authentication.
      operationId: getVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
      security:
      - ossi-basic-auth: []
      summary: Get API version
      tags:
      - OSS Index Compatibility
  /billing:
    get:
      description: "Retrieves billing details including cost, period, and payment\
        \ method"
      operationId: getBilling
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDTO"
          description: Billing info retrieved
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDTO"
          description: User is not an organization owner
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDTO"
          description: Subscription not found
      summary: Get billing information
      tags:
      - Billing
  /billing/invoices:
    get:
      description: "Retrieves the complete invoice history for the current user. Returns\
        \ a list of all invoices with details including invoice ID, date, description,\
        \ amount, payment status, PDF link, and credit usage for each billing period."
      operationId: getUserInvoiceHistory
      responses:
        "200":
          content:
            application/json:
              schema:
                example:
                  invoices:
                  - amount: 1200.0
                    creditsTotal: 5000
                    creditsUsed: 3000
                    date: 2024-10-31
                    description: Teams Plan (Annual)
                    id: inv_2024_001
                    pdfUrl: /invoices/inv_2024_001.pdf
                    status: paid
                type: string
          description: Invoice history retrieved successfully
        "403":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Invoice"
                type: array
          description: User is not an organization owner and cannot access billing
            information
      summary: Get user invoice history
      tags:
      - Billing
  /billing/invoices/{invoiceId}/pdf:
    get:
      description: Redirects to a temporary Chargebee download URL for the invoice
        PDF. The URL is short-lived and should be consumed immediately.
      operationId: getInvoicePdf
      parameters:
      - explode: false
        in: path
        name: invoiceId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "302":
          description: Redirect to PDF download URL
        "403":
          description: User is not an organization owner
        "404":
          description: Invoice not found or PDF unavailable
      summary: Download invoice PDF
      tags:
      - Billing
  /billing/plans:
    get:
      description: "Retrieves all active subscription plans with dynamic Chargebee\
        \ pricing. Supports both authenticated and unauthenticated requests. When\
        \ authenticated, the user's current plan is marked."
      operationId: getPlans
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/PlanDTO"
                type: array
          description: Plans retrieved
      summary: Get all available plans
      tags:
      - Billing
  /components/dependencies:
    get:
      description: "Retrieves all direct dependencies of a specific component using\
        \ explicit coordinate parameters (format, namespace, name, version). Returns\
        \ full component details for each dependency with comprehensive filtering\
        \ by format, category, CVSS severity, and license. Namespace is optional for\
        \ some formats"
      operationId: getComponentDependenciesByPurlQueryParam
      parameters:
      - description: "URL-encoded PURL (e.g., pkg%3Amaven%2F...)"
        explode: true
        in: query
        name: purl
        required: true
        schema:
          type: string
        style: form
      - description: "Text search query (searches name, namespace, refid)"
        explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - description: "Pagination offset (default: 0)"
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Pagination limit (default: 20)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Field to sort by (default: name)"
        explode: true
        in: query
        name: sortField
        required: false
        schema:
          type: string
        style: form
      - description: "Sort order: asc or desc (default: asc)"
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          type: string
        style: form
      - description: "Format filter (e.g., maven, npm, pypi) - repeatable"
        explode: true
        in: query
        name: formats
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "Category filter (e.g., Logging, Framework) - repeatable"
        explode: true
        in: query
        name: categories
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "CVSS severity filter (e.g., critical, high) - repeatable"
        explode: true
        in: query
        name: severities
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Minimum CVSS score (0.0 to 10.0)
        explode: true
        in: query
        name: minCvss
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: Maximum CVSS score (0.0 to 10.0)
        explode: true
        in: query
        name: maxCvss
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: Minimum version score (0 to 100)
        explode: true
        in: query
        name: minVersionScore
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Maximum version score (0 to 100)
        explode: true
        in: query
        name: maxVersionScore
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Licence family filter (e.g., Banned, Copyleft) - repeatable"
        explode: true
        in: query
        name: licenseFamilies
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "Licence name filter (e.g., MIT, Apache-2.0, GPL-3.0+) - repeatable"
        explode: true
        in: query
        name: licenses
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "Filter by latest stable versions: 'true' for stable only, 'false'\
          \ for non-stable only, 'all' for no filter"
        explode: true
        in: query
        name: latestStable
        required: false
        schema:
          type: string
        style: form
      - description: "Package format (e.g., maven, npm, pypi)"
        explode: true
        in: query
        name: format
        required: true
        schema:
          type: string
        style: form
      - description: Package namespace/groupId (optional)
        explode: true
        in: query
        name: namespace
        required: false
        schema:
          type: string
        style: form
      - description: Package name
        explode: true
        in: query
        name: name
        required: true
        schema:
          type: string
        style: form
      - description: Package version
        explode: true
        in: query
        name: version
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiSearchResponse"
          description: Dependencies found
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiSearchResponseComponentDocument"
          description: Invalid parameters
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiSearchResponseComponentDocument"
          description: Component not found
      summary: Get dependencies for a component by coordinates (query parameters)
      tags:
      - Components
  /components/detail:
    get:
      description: "Retrieves detailed information about a specific component using\
        \ explicit coordinate parameters (format, namespace, name, version). Namespace\
        \ is optional for some formats"
      operationId: getComponentDetailByPurlQueryParam
      parameters:
      - description: "URL-encoded PURL (e.g., pkg%3Amaven%2F...)"
        explode: true
        in: query
        name: purl
        required: true
        schema:
          type: string
        style: form
      - description: "Package format (e.g., maven, npm, pypi)"
        explode: true
        in: query
        name: format
        required: true
        schema:
          type: string
        style: form
      - description: Package namespace/groupId (optional)
        explode: true
        in: query
        name: namespace
        required: false
        schema:
          type: string
        style: form
      - description: Package name
        explode: true
        in: query
        name: name
        required: true
        schema:
          type: string
        style: form
      - description: Package version
        explode: true
        in: query
        name: version
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComponentDetailDocument"
          description: Component found
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComponentDetailDocument"
          description: Invalid parameters
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComponentDetailDocument"
          description: Component not found
      summary: Get component detail by coordinates (query parameters)
      tags:
      - Components
  /components/latest-version:
    post:
      description: "Retrieves the latest version of a component specified by PURL.\
        \ The PURL should not include a version, or the version will be ignored."
      operationId: getLatestVersion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LatestVersionRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComponentDetailDocument"
          description: Latest version found
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComponentDetailDocument"
          description: Invalid request - PURL is required
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComponentDetailDocument"
          description: Component not found
      summary: Get latest version of a component
      tags:
      - Components
  /components/versions:
    get:
      description: "Retrieves all versions of a component using explicit coordinate\
        \ parameters (format, namespace, name, version). Returns all versions EXCEPT\
        \ the version specified. Namespace is optional for some formats"
      operationId: getComponentVersionsByPurlQueryParam
      parameters:
      - description: "URL-encoded PURL (e.g., pkg%3Amaven%2F...)"
        explode: true
        in: query
        name: purl
        required: true
        schema:
          type: string
        style: form
      - description: "Pagination offset (default: 0)"
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Pagination limit (default: 20)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Field to sort by (default: version)"
        explode: true
        in: query
        name: sortField
        required: false
        schema:
          type: string
        style: form
      - description: "Sort order: asc or desc (default: desc)"
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          type: string
        style: form
      - description: "CVSS severity filter (e.g., critical, high) - repeatable"
        explode: true
        in: query
        name: severities
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Minimum CVSS score (0.0 to 10.0)
        explode: true
        in: query
        name: minCvss
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: Maximum CVSS score (0.0 to 10.0)
        explode: true
        in: query
        name: maxCvss
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: Minimum version score (0 to 100)
        explode: true
        in: query
        name: minVersionScore
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Maximum version score (0 to 100)
        explode: true
        in: query
        name: maxVersionScore
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Filter versions by version prefix (e.g., '2.10' matches '2.10.0',\
          \ '2.10.1', '2.10-RC1')"
        explode: true
        in: query
        name: versionQuery
        required: false
        schema:
          type: string
        style: form
      - description: "Time window for published date (e.g., 7d, 30d, 60d, 90d, 6m,\
          \ 1y, 2y)"
        explode: true
        in: query
        name: publishedWindow
        required: false
        schema:
          type: string
        style: form
      - description: "Malware filter (true=has malware, false=no malware)"
