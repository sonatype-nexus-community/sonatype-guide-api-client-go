      description: Retrieves organization information without billing/usage details
      operationId: getCurrentUserOrganization
      responses:
        "200":
          content:
            application/json: {}
          description: Organization found
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganizationDTO"
          description: Invalid JWT token
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganizationDTO"
          description: Organization not found
      security:
      - bearer-jwt: []
      summary: Get current user's organization
      tags:
      - Current User Organization
    put:
      description: "Updates the organization's name, logo URL and URL"
      operationId: updateOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Organization updated successfully
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganizationDTO"
          description: Invalid JWT token
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganizationDTO"
          description: Organization not found
      security:
      - bearer-jwt: []
      summary: Update current user's organization
      tags:
      - Current User Organization
  /users/me/organization/activity-log:
    get:
      description: Returns a paginated list of activity events for the caller's organization.
        Only accessible by organization owners.
      operationId: getActivityLog
      parameters:
      - description: "Filter by category (TOKEN, ORGANIZATION, BILLING, SUPPORT)"
        explode: true
        in: query
        name: category
        required: false
        schema:
          enum:
          - TOKEN
          - ORGANIZATION
          - BILLING
          - SUPPORT
          type: string
        style: form
      - description: Start date (YYYY-MM-DD)
        example: 2026-06-01
        explode: true
        in: query
        name: fromDate
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: End date (YYYY-MM-DD)
        example: 2026-06-30
        explode: true
        in: query
        name: toDate
        required: false
        schema:
          format: date
          type: string
        style: form
      - description: Page number (0-indexed)
        example: 0
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: Page size (max 100)
        example: 50
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 50
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgActivityLogResponse"
          description: Activity log retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgActivityLogResponse"
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgActivityLogResponse"
          description: Caller is not an organization owner
      security:
      - bearer-jwt: []
      summary: Get organization activity log
      tags:
      - Activity Log
  /users/me/organization/invitations/{invitationToken}/accept:
    post:
      description: Accept an invitation to join an organization using the invitation
        token from the email link
      operationId: acceptInvitation
      parameters:
      - explode: false
        in: path
        name: invitationToken
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Invitation accepted successfully
        "400":
          description: "Invalid or expired invitation token, email mismatch, or user\
            \ already in organization"
        "401":
          description: Invalid JWT token
      security:
      - bearer-jwt: []
      summary: Accept organization invitation
      tags:
      - Current User Organization
  /users/me/organization/members:
    delete:
      description: "Removes multiple members or pending invitations from the authenticated\
        \ user's organization. All removals happen in a single transaction - if any\
        \ removal fails, all are rolled back."
      operationId: bulkRemoveMembersOrInvitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRemoveMembersRequest"
        required: true
      responses:
        "204":
          description: All members and invitations removed successfully
        "400":
          description: Invalid request or email list is empty
        "401":
          description: Invalid JWT token
        "404":
          description: "Organization not found, user is not owner, or one or more\
            \ members/invitations not found"
      security:
      - bearer-jwt: []
      summary: Bulk remove members or invitations from organization
      tags:
      - Current User Organization
    get:
      description: Retrieves members and invitees of the authenticated user's organization
      operationId: retrieveOrganizationMembersAsCsv
      responses:
        "200":
          content:
            text/csv: {}
          description: Organization members retrieved successfully
        "401":
          content:
            text/csv:
              schema:
                format: byte
                type: string
          description: Invalid JWT token
      security:
      - bearer-jwt: []
      summary: Retrieve current user's organization members and invitees
      tags:
      - Current User Organization
  /users/me/organization/members/invite:
    post:
      description: Sends an invitation to an email list to join the organization
      operationId: inviteUsers
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUsersRequest"
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Invitations sent successfully
        "400":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/OrganizationMembersResponse"
                type: array
          description: Invalid request or user already invited
        "401":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/OrganizationMembersResponse"
                type: array
          description: Invalid JWT token
        "404":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/OrganizationMembersResponse"
                type: array
          description: Organization not found or user is not owner
      security:
      - bearer-jwt: []
      summary: Invite users to current user's an organization
      tags:
      - Current User Organization
  /users/me/organization/members/{email}:
    delete:
      description: Removes a member or pending invitation from the authenticated user's
        organization
      operationId: removeMemberOrInvitation
      parameters:
      - explode: false
        in: path
        name: email
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Member or invitation removed successfully
        "401":
          description: Invalid JWT token
        "404":
          description: "Organization not found, user is not owner, or invitation not\
            \ found"
      security:
      - bearer-jwt: []
      summary: Remove member or invitation from organization
      tags:
      - Current User Organization
  /users/me/organization/membership:
    delete:
      description: Allows a member to leave their organization
      operationId: leaveOrganization
      responses:
        "204":
          description: Successfully left
        "400":
          description: "Owner, billing subscriber, or enterprise org"
        "401":
          description: Invalid JWT token
        "404":
          description: No organization
      security:
      - bearer-jwt: []
      summary: Leave organization
      tags:
      - Current User Organization
  /users/me/organization/onboarding-banner:
    delete:
      description: Marks the onboarding banner as dismissed for the organization.
        The banner will not reappear for any member of the organization across sessions
        or devices.
      operationId: dismissOnboardingBanner
      responses:
        "204":
          description: Banner dismissed successfully
        "401":
          description: Invalid JWT token
        "404":
          description: Organization not found
      security:
      - bearer-jwt: []
      summary: Dismiss onboarding banner
      tags:
      - Current User Organization
    get:
      description: "Retrieves the onboarding banner visibility status based on organization\
        \ plan, member count, and dismiss state. Returns showBanner=false when user\
        \ has no organization."
      operationId: getOnboardingBannerStatus
      responses:
        "200":
          content:
            application/json: {}
          description: Banner status retrieved successfully
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OnboardingBannerStatusDTO"
          description: Invalid JWT token
      security:
      - bearer-jwt: []
      summary: Get onboarding banner status
      tags:
      - Current User Organization
  /users/me/tokens:
    get:
      description: "Retrieves all tokens for the authenticated user, including active\
        \ and revoked tokens. Plaintext token values are not included."
      operationId: listTokens
      responses:
        "200":
          content:
            application/json: {}
          description: Tokens retrieved successfully
        "401":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/UserTokenDTO"
                type: array
          description: Invalid JWT token
      security:
      - bearer-jwt: []
      summary: List all Personal Access Tokens
      tags:
      - Current User Tokens
    post:
      description: Creates a new token for API authentication. The plaintext token
        is ONLY returned in this response and cannot be retrieved again.
      operationId: createToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Token created successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserTokenWithPlaintextDTO"
          description: "Invalid request (e.g., empty name)"
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserTokenWithPlaintextDTO"
          description: Invalid JWT token
      security:
      - bearer-jwt: []
      summary: Create a new Personal Access Token
      tags:
      - Current User Tokens
  /users/me/tokens/{tokenId}:
    delete:
      description: "Revokes a token, preventing it from being used for authentication."
      operationId: revokeToken
      parameters:
      - explode: false
        in: path
        name: tokenId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "204":
          description: Token revoked successfully
        "401":
          description: Invalid JWT token
        "404":
          description: "Token not found or already revoked, or token does not belong\
            \ to user"
      security:
      - bearer-jwt: []
      summary: Revoke a Personal Access Token
      tags:
      - Current User Tokens
    get:
      description: Retrieves a specific token for the authenticated user by ID. Plaintext
        token value is not included.
      operationId: getTokenById
      parameters:
      - explode: false
        in: path
        name: tokenId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json: {}
          description: Token retrieved successfully
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserTokenDTO"
          description: Invalid JWT token
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserTokenDTO"
          description: Token not found or does not belong to user
      security:
      - bearer-jwt: []
      summary: Get a Personal Access Token by ID
      tags:
      - Current User Tokens
  /users/me/tokens/{tokenId}/rotate:
    post:
      description: Revokes the specified token and creates a new one in a single atomic
        operation. The plaintext token is ONLY returned in this response and cannot
        be retrieved again.
      operationId: rotateToken
      parameters:
      - explode: false
        in: path
        name: tokenId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json: {}
          description: Token rotated successfully
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserTokenWithPlaintextDTO"
          description: Invalid request
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserTokenWithPlaintextDTO"
          description: Invalid JWT token
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserTokenWithPlaintextDTO"
          description: "Token not found or already revoked, or token does not belong\
            \ to user"
      security:
      - bearer-jwt: []
      summary: Rotate a Personal Access Token
      tags:
      - Current User Tokens
  /vulnerabilities/{id}:
    get:
      description: "Retrieves detailed information about a specific vulnerability\
        \ including explanation, detection methods, recommendations, and references.\
        \ Note: Large arrays (affectedComponentVersions, vulnerableMethods) are excluded\
        \ for performance - use /{id}/components endpoint for paginated affected components."
      operationId: getVulnerabilityByRefId
      parameters:
      - description: "Vulnerability ID (e.g., CVE-2021-44228, GHSA-xxxx-yyyy-zzzz)"
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VulnerabilityDetailDocument"
          description: Vulnerability found
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VulnerabilityDetailDocument"
          description: Vulnerability not found
      summary: Get vulnerability by ID
      tags:
      - Vulnerabilities
  /vulnerabilities/{id}/components:
    get:
      description: "Retrieves paginated list of affected component versions for a\
        \ specific vulnerability with optional text filtering and sorting. Returns\
        \ parsed component structures with ecosystem, namespace, packageName, version,\
        \ and fullPackageName fields."
      operationId: getVulnerabilityAffectedComponents
      parameters:
      - description: "Vulnerability ID (e.g., CVE-2021-44228, GHSA-xxxx-yyyy-zzzz)"
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: "Text search query (filters ecosystem, namespace, package, version\
          \ fields)"
        explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - description: "Pagination offset (default: 0)"
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: "Pagination limit (default: 50)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Field to sort by: ecosystem, package/component (aliases), version\
          \ (default: component)"
        explode: true
        in: query
        name: sortField
        required: false
        schema:
          type: string
        style: form
      - description: "Sort order: asc or desc (default: asc)"
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiSearchResponse"
          description: Components retrieved successfully
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiSearchResponseAffectedComponentVersion"
          description: Vulnerability not found
      summary: Get affected components for a vulnerability
      tags:
      - Vulnerabilities
