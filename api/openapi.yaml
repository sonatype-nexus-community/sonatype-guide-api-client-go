  /recommendations:
    post:
      description: "Retrieves version upgrade recommendations for a component specified\
        \ by PURL. Analyzes security vulnerabilities, stability metrics, and policy\
        \ compliance to suggest optimal upgrade paths. Only policy-compliant versions\
        \ are returned. If a PURL cannot be parsed or policy evaluation fails, the\
        \ response is BLOCKED_BY_POLICY (fail-closed)."
      operationId: getRecommendations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
          description: Success. Returns fromVersion and toVersions array (empty if
            component is already optimal or all candidates violate policy)
        "400":
          content:
            '*/*':
              schema:
                type: object
          description: Invalid request - malformed PURL or missing required parameters
        "404":
          content:
            '*/*':
              schema:
                type: object
          description: Component not found or no recommendations available
      summary: Get version upgrade recommendations
      tags:
      - Recommendations
