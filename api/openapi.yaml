openapi: 3.1.0
info:
  contact:
    name: Sonatype Community Maintainers
    url: https://github.com/sonatype-nexus-community
  description: "REST API into [Sonatype Guide](https://guide.sonatype.com)."
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Sonatype Guide API
  version: "202608"
servers:
- description: Production
  url: https://api.guide.sonatype.com
security:
- bearer-jwt: []
tags:
- description: Credit usage and billing period APIs
  name: Usage
- description: "Connected repository status with search, filter & paging"
  name: AGP Dashboard
- description: Organization activity log APIs
  name: Activity Log
- description: Onboard multiple repositories in one operation
  name: AGP Bulk Onboarding
- description: Personal Access Token management APIs
  name: Current User Tokens
- description: "AgentP feature governance: Default Configuration and per-repo config\
    \ writes are Owner-only; reads and per-repo lifecycle actions are available to\
    \ any org member"
  name: AGP Governance
- description: Legacy OSSI API providing backward compatibility. Allows existing OSSI
    users to continue using their OSSI API tokens without creating a new Sonatype
    Guide account. Authentication requires HTTP Basic Auth with OSSI username and
    API token.
  name: OSS Index Compatibility
- description: Billing and subscription management API
  name: Billing
- description: Version upgrade recommendation API
  name: Recommendations
- description: Vulnerability search and filtering API
  name: Vulnerabilities
- description: Sonatype Security Events search and detail API
  name: Security Events
- description: Component search and filtering API
  name: Components
- description: Current user organization management APIs
  name: Current User Organization
paths:
  /api/agp/agentic-mode-access:
    get:
      operationId: agenticModeAccess
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgenticModeAccessResponse"
          description: OK
      summary: Whether the caller's org is registered for AgentP agentic mode (org-scoped;
        gates the AI Fix toggle + AI agent config in the UI)
      tags:
      - AGP Governance
  /api/agp/dashboard:
    get:
      operationId: dashboard
      parameters:
      - description: Name filter (canonical). Takes precedence over the deprecated
          `search`.
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - deprecated: true
        description: Deprecated alias for `q`; ignored when `q` is also provided.
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: asc
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 25
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DashboardPageResponse"
          description: OK
      summary: "List connected repositories with status (search, filter & paging)"
      tags:
      - AGP Dashboard
  /api/agp/dashboard/candidate-ids:
    get:
      operationId: candidateIds
      parameters:
      - explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  format: int64
                  type: integer
                type: array
          description: OK
      summary: Ids of all onboarding-candidate repositories matching the name filter
      tags:
      - AGP Dashboard
  /api/agp/dashboard/onboarding-access:
    get:
      operationId: onboardingAccess
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OnboardingAccessResponse"
          description: OK
      summary: Whether the caller may onboard repositories
      tags:
      - AGP Dashboard
  /api/agp/onboarding/bulk:
    post:
      operationId: start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOnboardRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOnboardResponse"
          description: OK
      summary: Start bulk onboarding for selected repositories
      tags:
      - AGP Bulk Onboarding
  /api/agp/onboarding/bulk/active:
    get:
      operationId: active
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JobProgress"
          description: OK
      summary: "Get the caller's currently-running bulk onboarding job, if any"
      tags:
      - AGP Bulk Onboarding
  /api/agp/onboarding/bulk/org-activity:
    get:
      operationId: orgActivity
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrgOnboardingActivity"
          description: OK
      summary: Whether another org member currently has a bulk onboarding job in flight
      tags:
      - AGP Bulk Onboarding
  /api/agp/onboarding/bulk/{jobId}:
    get:
      operationId: progress
      parameters:
      - explode: false
        in: path
        name: jobId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JobProgress"
          description: OK
      summary: Get bulk onboarding job progress
      tags:
      - AGP Bulk Onboarding
  /api/agp/org/config:
    get:
      operationId: getOrgConfig
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrgGovernanceView"
          description: OK
      summary: "Get the AgentP Default Configuration (read: any org member)"
      tags:
      - AGP Governance
    put:
      operationId: updateOrgConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgConfigRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GovernanceWriteResponse"
          description: OK
      summary: Set the AgentP Default Configuration + developer-access flag (Owner-only)
      tags:
      - AGP Governance
  /api/agp/org/effective-config:
    get:
      operationId: getOrgEffectiveConfig
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveConfigYamlResponse"
          description: OK
      summary: Get the rendered Default Configuration agp.yml (defaults + org) (Owner-only)
      tags:
      - AGP Governance
  /api/agp/repos/{installationRepoId}/config:
    delete:
      operationId: deleteRepoConfig
      parameters:
      - explode: false
        in: path
        name: installationRepoId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - explode: true
        in: query
        name: expectedVersion
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          description: OK
      summary: Reset a repo to the Default Configuration by clearing its config overrides
        (Owner-only)
      tags:
      - AGP Governance
    get:
      operationId: getRepoConfig
      parameters:
      - explode: false
        in: path
        name: installationRepoId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RepoGovernanceView"
          description: OK
      summary: Get a repo's AgentP config overrides + inherited Default Configuration
        + version (any org member)
      tags:
      - AGP Governance
    put:
      operationId: updateRepoConfig
      parameters:
      - explode: false
        in: path
        name: installationRepoId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoConfigRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GovernanceWriteResponse"
          description: OK
      summary: Set per-repo AgentP config overrides (Owner-only)
      tags:
      - AGP Governance
  /api/agp/repos/{installationRepoId}/effective-config:
    get:
      operationId: getRepoEffectiveConfig
      parameters:
      - explode: false
        in: path
        name: installationRepoId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveConfigYamlResponse"
          description: OK
      summary: Get the rendered effective agp.yml for a repo (defaults + org + overrides)
        (any org member)
      tags:
      - AGP Governance
  /api/agp/repos/{installationRepoId}/pause:
    post:
      operationId: pause
      parameters:
      - explode: false
        in: path
        name: installationRepoId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          description: OK
      summary: Pause AgentP for a repository (any org member)
      tags:
      - AGP Governance
  /api/agp/repos/{installationRepoId}/removal-pr:
    post:
      operationId: openRemovalPr
      parameters:
      - explode: false
        in: path
        name: installationRepoId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - explode: true
        in: query
        name: merge
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RemovalPrResult"
          description: OK
      summary: Open (and optionally merge) a PR removing the AgentP workflow file
        from a repository (any org member)
      tags:
      - AGP Governance
  /api/agp/repos/{installationRepoId}/resume:
    post:
      operationId: resume
      parameters:
      - explode: false
        in: path
        name: installationRepoId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          description: OK
      summary: Resume AgentP for a repository (any org member)
      tags:
      - AGP Governance
  /api/v3/authorized/component-report:
    post:
      description: |
        Retrieves component reports for multiple Package URLs (PURLs) in a single request.

        Authentication:
        - HTTP Basic Authentication required
        - Authorization header: Basic <base64(username:apiToken)>

        Request Body:
        - Array of PURLs (max 128 components)
        - Each PURL must include a version

        Response Headers:
        - X-Batch-Size: Total number of components requested
        - X-Batch-Found: Number of components found
        - X-Credits-Used: Credits consumed for this request
        - X-Credits-Remaining: Available credit balance
        - X-Credits-Warning: Alert when approaching credit limit (JSON)

        Note: Credits are only charged for components found. Requests for the same
        components on the same day are not charged multiple times.
      operationId: getComponentReports_1
      parameters:
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurlRequest_Post"
          application/vnd.ossindex.component-report-request.v1+json:
            schema:
              $ref: "#/components/schemas/PurlRequest_Post"
        required: true
      responses:
        "200":
          content:
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
          description: Component reports retrieved successfully
        "400":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
          description: Invalid request - missing coordinates or invalid PURL format
        "401":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
          description: Unauthorized - invalid credentials
        "402":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
          description: Payment required - insufficient credits
        "500":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
            application/vnd.ossindex.component-report.v1+json:
              schema:
                items:
                  $ref: "#/components/schemas/ComponentReport_Post"
                type: array
          description: Internal server error - OSSI service unavailable or other system
            error
      security:
      - ossi-basic-auth: []
      summary: Get component reports for multiple PURLs
      tags:
      - OSS Index Compatibility
  /api/v3/authorized/component-report/**:
    get:
      description: |
        Retrieves a component report for a single Package URL (PURL).

        Authentication:
        - HTTP Basic Authentication required
        - Authorization header: Basic <base64(username:apiToken)>

        Response Headers:
        - X-Credits-Used: Credits consumed for this request
        - X-Credits-Remaining: Available credit balance
        - X-Credits-Warning: Alert when approaching credit limit (JSON)

        Note: Credits are only charged when a component is found. Requests for the same
        component on the same day are not charged multiple times.
      operationId: getComponentReport
      parameters:
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/vnd.ossindex.component-report.v1+json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
          description: Component report retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
            application/vnd.ossindex.component-report.v1+json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
          description: Invalid request - missing coordinates or invalid PURL format
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
            application/vnd.ossindex.component-report.v1+json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
          description: Unauthorized - invalid credentials
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
            application/vnd.ossindex.component-report.v1+json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
          description: Payment required - insufficient credits
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
            application/vnd.ossindex.component-report.v1+json:
              schema:
                $ref: "#/components/schemas/ComponentReport_Get"
          description: Internal server error - OSSI service unavailable or other system
            error
      security:
      - ossi-basic-auth: []
      summary: Get component report by PURL
      tags:
      - OSS Index Compatibility
